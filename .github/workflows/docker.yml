name: Docker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t node-api:${{ github.sha }} .

      - name: Run container
        run: docker run -d -p 3000:3000 --name api node-api:${{ github.sha }}

      - name: Smoke test
        run: |
          sleep 3
          curl --fail http://localhost:3000/health

      - name: Show container logs on failure
        if: failure()
        run: docker logs api

  publish:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/g-bot001/docker-node-api:${{ github.sha }} \
            -t ghcr.io/g-bot001/docker-node-api:latest .

      - name: Push image
        run: docker push --all-tags ghcr.io/g-bot001/docker-node-api